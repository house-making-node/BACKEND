        in: path
        required: true
        schema:
          properties:
            letter_id:
              type: bigint
              description: 공유레터 ID
              example: 1
      responses:
        '200':
          description: 특정 공유레터 조회 성공
          schema:
            type: object
            properties:
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 2000
              message:
                type: string
                example: "success!"
              data:
                type: object
                example:
                  "letter_id" : 6
                  "share_id": 16
                  "title" : "title"
                  "s3_key" : "share_letters/4bd1b421e1e15a508d8a11d83f5901be_home.jpg"
                  "content" : "content"
                  "create_at" : "2024.7.31"
        '400':
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: "잘못된 요청입니다"
        '500':
          description: 서버 에러
          schema:
            type: object
            properties:
              tatus:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: "서버 에러, 관리자에게 문의 바랍니다."
  /share_letters/{letter_id}/opinions:
    post:
      tags:
        - Share Letter
      summary: 특정 공유레터에 대한 사용자의 의견 제출
      parameters:
        - name: letter_id
          in: path
          required: true
          schema:
            properties:
              letter_id:
                type: bigint
                description: 공유레터 ID
                example: 1
        - name: Opinions
          in: body
          required: true
          schema:
            properties:
              user_id:
                type: bigint
                example: 1
              is_satisfy:
                type: boolean
                example: true
              satisfy_detail_1:
                type: boolean
                example: true
              satisfy_detail_2:
                type: boolean
                example: true
              satisfy_detail_3:
                type: boolean
                example: true
              unsatisfy_detail_1:
                type: boolean
                example: true
              unsatisfy_detail_2:
                type: boolean
                example: true
              unsatisfy_detail_3:
                type: boolean
                example: true
              opinion_good:
                type: text
                example: "good"
              opinion_bad:
                type: text
                example: "abcd"
              comment:
                type: text
                example: "comment"
      responses:
        '200':
          description: 특정 공유레터에 대한 사용자 의견 제출 성공
          schema:
            type: object
            properties:
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 2000
              message:
                type: string
                example: "success!"
              data:
                type: object
                example:
                  "opinion_id" : 6
                  "user_id": 1
                  "letter_id" : 1
        '400':
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: "잘못된 요청입니다"
        '500':
          description: 서버 에러
          schema:
            type: object
            properties:
              tatus:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: "서버 에러, 관리자에게 문의 바랍니다."
  /share_letters/scrap:
