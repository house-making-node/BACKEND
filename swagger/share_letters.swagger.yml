info:
  title : 공유레터 API
  description: 공유레터 구독정보/제출/리스트/의견을 관리하는 API

paths:
  /share_letters/subscribe:
    post:
      tags:
       - Share Letter
      summary: 사용자의 공유레터 구독정보 저장
      parameters:
      - name: addShareLetterSubInfo
        in: body
        required: true
        schema: 
          properties:
            user_id:
              type: bigint
              example: 1
            email:
              type: string
              maxLength: 15
              example: "user@example.com"
            name: 
              type: string
              maxLength: 10
              example: "user"
      responses:
        '200':
          description: 사용자 구독정보 저장 성공
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 2000
              message:
                type: string
                exmaple: "success!"
              data:
                type: object
                exmaple:
                  "user_id" : 1
                  "email" : "user@example.com"
                  "name": "user"
        '400' :
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: 잘못된 요청입니다
        '500' :
          description: 서버 에러
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: 서버 에러, 관리자에게 문의 바랍니다.
  /share_letters/submit:
    post:
      tags:
        - Share Letter
      summary: 공유레터 제출하기
      consumes:
        - multipart/form-data
      parameters:
        - name: directory
          in: formData
          required: true
          type: string
          description: S3 폴더 경로
          example: "share_letters"
        - name: image
          in: formData
          type: file
          description: 공유레터 썸네일 업로드
          required: true
        - name: user_id
          in: formData  
          required: true
          type: integer
          format: int64
          description: 사용자 ID
          example: 1
        - name: nickname
          in: formData
          required: true
          type: string
          maxLength: 50
          description: 사용자 닉네임
          example: "user"
        - name: age
          in: formData
          required: true
          type: integer
          description: 사용자 나이
          example: 20
        - name: experience_detail
          in: formData
          required: true
          type: string
          description: 공유레터 내용
          exmaple: "example"
        - name: experience_comment
          in: formData
          required: true
          type: string
          description: 집꾸에게 보내는 의견
          example: "example"
        - name: title
          in: formData
          required: true
          type: string
          maxLength: 100
          description: 공유레터 제목
          example: "title"
      responses:
        '200':
          description: 공유레터 제출 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  isSuccess: 
                    type: boolean
                    example: true
                  code: 
                    type: integer
                    example: 2000
                  message: 
                    type: string
                    example: "success!"
                  data:
                    type: object
                    example:
                      "user_id" : 1
                      "share_id" : 1
                      "title" : "title"
                      "nickname" : "nickname"
                      "age" : 1
                      "experience_detail" : "experience_detail"
                      "experience_comment" : "experience_comment"
                      "s3_key": "share_letters/122.jpg"
        '400' :
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: 잘못된 요청입니다
        '500' :
          description: 서버 에러
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: 서버 에러, 관리자에게 문의 바랍니다.
  /share_letters:
    get:
      tags:
        - Share Letter
      summary: 공유레터 목록 조회
      description: 공유레터 목록을 가져옵니다.
      parameters:
      - name: offset
        in: query
        required: true
        type: integer
        description: 조회를 시작할 오프셋 (0부터 시작)
        example: 0
      - name: limit
        in: query
        required: true
        type: integer
        description: 한 번에 가져올 공유레터의 수
        example: 2
      responses:
        '200':
          description: 공유레터 목록 조회 성공
          schema:
            type: object
            properties:
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 2000
              message:
                type: string
                example: "success!"
              data:
                type: object
                example:
                  "letter_id" : 6
                  "share_id": 16
                  "title" : "title"
                  "s3_key" : "share_letters/4bd1b421e1e15a508d8a11d83f5901be_home.jpg"
                  "create_at" : "2024.7.31"
        '400':
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: "잘못된 요청입니다"
        '500':
          description: 서버 에러
          schema:
            type: object
            properties:
              tatus:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: "서버 에러, 관리자에게 문의 바랍니다."
  /share_letters/{letter_id}:
    get:
